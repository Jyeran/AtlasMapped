name: AtlasMapped
options:
  bundleIdPrefix: com.atlasmapped
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Atlas
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Atlas uses your location to navigate trails and record route progress.
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Atlas uses your location to keep route progress accurate while you hike.
targets:
  Atlas-iOS:
    type: application
    platform: iOS
    sources:
      - Atlas/Sources
      - Atlas/Shared
      - Atlas/Assets.xcassets
    dependencies:
      - target: AtlasLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasmapped.ios
        DEVELOPMENT_TEAM: 3GZG2C29FM
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Atlas/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        UBIQUITY_KVSTORE_IDENTIFIER: $(TeamIdentifierPrefix)com.atlasmapped.ios
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  AtlasLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - Atlas/LiveActivity
      - Atlas/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasmapped.ios.liveactivity
        DEVELOPMENT_TEAM: 3GZG2C29FM
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Atlas/LiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  Atlas-macOS:
    type: application
    platform: macOS
    sources:
      - Atlas/Sources
      - Atlas/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasmapped.macos
        CODE_SIGN_ENTITLEMENTS: Atlas/Atlas-macOS.entitlements
        CODE_SIGN_STYLE: Automatic
        UBIQUITY_KVSTORE_IDENTIFIER: $(TeamIdentifierPrefix)com.atlasmapped.ios
